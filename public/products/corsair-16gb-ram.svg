    <rect x="100" y="310" width="600" height="180" rx="12" fill="#0f172a" stroke="#334155" stroke-width="3"/>

    <!-- Top Heat Fins Cutout -->
    <g fill="#1e293b">
      
        <rect x="140" y="295" width="24" height="24" rx="4"/>
      
        <rect x="184" y="295" width="24" height="24" rx="4"/>
      
        <rect x="228" y="295" width="24" height="24" rx="4"/>
      
        <rect x="272" y="295" width="24" height="24" rx="4"/>
      
        <rect x="316" y="295" width="24" height="24" rx="4"/>
      
