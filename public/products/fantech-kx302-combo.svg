<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </radialGradient>
    <linearGradient id="rgb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="75%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)" rx="32"/>

  <!-- Combo: Keyboard + Mouse -->
  <g filter="url(#shadow)">
    <!-- Keyboard Body -->
    <rect x="100" y="240" width="460" height="280" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="3"/>
    
    <!-- RGB Backlight Rim Under Keys -->
    <rect x="115" y="255" width="430" height="250" rx="10" fill="none" stroke="url(#rgb)" stroke-width="4" opacity="0.9"/>

    <!-- Keycaps Layout Matrix -->
    <g fill="#1e293b" stroke="#334155" stroke-width="1">
      
          <rect x="130" y="275" width="42" height="38" rx="5"/>
        
          <rect x="180" y="275" width="42" height="38" rx="5"/>
        
          <rect x="230" y="275" width="42" height="38" rx="5"/>
        
          <rect x="280" y="275" width="42" height="38" rx="5"/>
        
          <rect x="330" y="275" width="42" height="38" rx="5"/>
        
          <rect x="380" y="275" width="42" height="38" rx="5"/>
        
          <rect x="430" y="275" width="42" height="38" rx="5"/>
        
          <rect x="480" y="275" width="42" height="38" rx="5"/>
        
          <rect x="130" y="320" width="42" height="38" rx="5"/>
        
          <rect x="180" y="320" width="42" height="38" rx="5"/>
        
          <rect x="230" y="320" width="42" height="38" rx="5"/>
        
          <rect x="280" y="320" width="42" height="38" rx="5"/>
        
          <rect x="330" y="320" width="42" height="38" rx="5"/>
        
          <rect x="380" y="320" width="42" height="38" rx="5"/>
        
          <rect x="430" y="320" width="42" height="38" rx="5"/>
        
          <rect x="480" y="320" width="42" height="38" rx="5"/>
        
          <rect x="130" y="365" width="42" height="38" rx="5"/>
        
          <rect x="180" y="365" width="42" height="38" rx="5"/>
        
          <rect x="230" y="365" width="42" height="38" rx="5"/>
        
          <rect x="280" y="365" width="42" height="38" rx="5"/>
        
          <rect x="330" y="365" width="42" height="38" rx="5"/>
        
          <rect x="380" y="365" width="42" height="38" rx="5"/>
        
          <rect x="430" y="365" width="42" height="38" rx="5"/>
        
          <rect x="480" y="365" width="42" height="38" rx="5"/>
        
          <rect x="130" y="410" width="42" height="38" rx="5"/>
        
          <rect x="180" y="410" width="42" height="38" rx="5"/>
        
          <rect x="230" y="410" width="42" height="38" rx="5"/>
        
          <rect x="280" y="410" width="42" height="38" rx="5"/>
        
          <rect x="330" y="410" width="42" height="38" rx="5"/>
        
          <rect x="380" y="410" width="42" height="38" rx="5"/>
        
          <rect x="430" y="410" width="42" height="38" rx="5"/>
        
          <rect x="480" y="410" width="42" height="38" rx="5"/>
        
    </g>
    <!-- Spacebar -->
    <rect x="230" y="455" width="200" height="38" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>

    <!-- Fantech Logo on Keyboard -->
    <text x="130" y="478" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#ef4444" letter-spacing="1">FANTECH</text>

    <!-- Gaming Mouse -->
    <path d="M600,320 C640,320 670,360 670,420 C670,490 640,540 600,540 C560,540 530,490 530,420 C530,360 560,320 600,320 Z" fill="#0f172a" stroke="#1e293b" stroke-width="3"/>
    
    <!-- RGB Strip on Mouse Spine -->
    <path d="M600,335 L600,515" stroke="url(#rgb)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Scroll Wheel -->
    <rect x="594" y="345" width="12" height="30" rx="4" fill="#38bdf8"/>

    <!-- Label -->
    <text x="400" y="610" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#0f172a">Fantech MAJOR KX-302</text>
    <text x="400" y="635" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#ef4444">RGB Backlit Gaming Keyboard &amp; Mouse Combo</text>
  </g>
</svg>