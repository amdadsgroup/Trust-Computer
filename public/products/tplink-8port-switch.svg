<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)" rx="32"/>

  <!-- Desktop Switch Body -->
  <g filter="url(#shadow)">
    <!-- Switch Box -->
    <rect x="150" y="320" width="500" height="190" rx="16" fill="#1e293b" stroke="#334155" stroke-width="3"/>
    
    <!-- Top Face highlight -->
    <path d="M150,336 Q150,320 166,320 L634,320 Q650,320 650,336 L650,350 L150,350 Z" fill="#334155"/>

    <!-- TP-Link Brand -->
    <text x="180" y="385" font-family="system-ui, sans-serif" font-weight="900" font-size="24" fill="#38bdf8" letter-spacing="1">tp-link</text>
    <text x="180" y="405" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#94a3b8">TL-SG1008D 8-Port Gigabit Switch</text>

    <!-- 8 RJ45 Ports -->
    <g transform="translate(180, 420)">
      
        <rect x="0" y="0" width="44" height="48" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
        <rect x="8" y="20" width="28" height="22" rx="3" fill="#0284c7" opacity="0.8"/>
        <!-- Port number and LED -->
        <circle cx="22" cy="-10" r="3.5" fill="#22c55e"/>
        <text x="22" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#94a3b8">1</text>
      
        <rect x="56" y="0" width="44" height="48" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
        <rect x="64" y="20" width="28" height="22" rx="3" fill="#0284c7" opacity="0.8"/>
        <!-- Port number and LED -->
        <circle cx="78" cy="-10" r="3.5" fill="#22c55e"/>
        <text x="78" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#94a3b8">2</text>
      
        <rect x="112" y="0" width="44" height="48" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
        <rect x="120" y="20" width="28" height="22" rx="3" fill="#0284c7" opacity="0.8"/>
        <!-- Port number and LED -->
        <circle cx="134" cy="-10" r="3.5" fill="#22c55e"/>
        <text x="134" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#94a3b8">3</text>
      
        <rect x="168" y="0" width="44" height="48" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
        <rect x="176" y="20" width="28" height="22" rx="3" fill="#0284c7" opacity="0.8"/>
        <!-- Port number and LED -->
        <circle cx="190" cy="-10" r="3.5" fill="#22c55e"/>
        <text x="190" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#94a3b8">4</text>
      
        <rect x="224" y="0" width="44" height="48" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
        <rect x="232" y="20" width="28" height="22" rx="3" fill="#0284c7" opacity="0.8"/>
        <!-- Port number and LED -->
        <circle cx="246" cy="-10" r="3.5" fill="#22c55e"/>
        <text x="246" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#94a3b8">5</text>
      
        <rect x="280" y="0" width="44" height="48" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
        <rect x="288" y="20" width="28" height="22" rx="3" fill="#0284c7" opacity="0.8"/>
        <!-- Port number and LED -->
        <circle cx="302" cy="-10" r="3.5" fill="#22c55e"/>
        <text x="302" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#94a3b8">6</text>
      
        <rect x="336" y="0" width="44" height="48" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
        <rect x="344" y="20" width="28" height="22" rx="3" fill="#0284c7" opacity="0.8"/>
        <!-- Port number and LED -->
        <circle cx="358" cy="-10" r="3.5" fill="#22c55e"/>
        <text x="358" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#94a3b8">7</text>
      
        <rect x="392" y="0" width="44" height="48" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
        <rect x="400" y="20" width="28" height="22" rx="3" fill="#0284c7" opacity="0.8"/>
        <!-- Port number and LED -->
        <circle cx="414" cy="-10" r="3.5" fill="#22c55e"/>
        <text x="414" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#94a3b8">8</text>
      
    </g>
  </g>
</svg>