name: Supabase Keep-Alive & Health Check Automation

# Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC) to ensure legitimate activity
# is continuously registered with Supabase to prevent inactivity pausing.
# Also supports manual trigger from GitHub Actions tab.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    name: Ping Database & Health Endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Application Keep-Alive Endpoint
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://trustcomputer.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Pinging application keep-alive at $APP_URL/api/cron/keepalive..."
          
          AUTH_HEADER=""
          if [ -n "$CRON_SECRET" ]; then
            AUTH_HEADER="Authorization: Bearer $CRON_SECRET"
          fi

          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -m 20 \
            -H "$AUTH_HEADER" \
            "$APP_URL/api/cron/keepalive" || true)

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -n1)

          echo "Response HTTP Status: $HTTP_CODE"
          echo "Response Body: $HTTP_BODY"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::warning ::Application keepalive returned status $HTTP_CODE"
          else
            echo "Application keepalive ping completed successfully."
          fi

      - name: Direct Supabase Gateway Fallback Ping (Optional)
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_ANON_KEY != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Executing direct Supabase REST API activity ping..."
          REST_ENDPOINT="${SUPABASE_URL%/}/rest/v1/site_settings?select=id&limit=1"

          SUPA_RESPONSE=$(curl -s -w "\n%{http_code}" -m 15 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Accept: application/json" \
            "$REST_ENDPOINT" || true)

          SUPA_CODE=$(echo "$SUPA_RESPONSE" | tail -n1)
          echo "Supabase REST Status: $SUPA_CODE"
